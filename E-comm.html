<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Landing Page</title>
    <link rel="stylesheet" href="E-comm.css" />
  </head>
  <body>
    <nav class="navbar">
      <div id="logo">KILN & CO.</div>
      <div id="top-right">
        <a href="">SHOP</a>
        <a href="">OUR STORE</a>
        <a href="">JOURNAL</a>
        <button id="cart-btn">CART</button>
      </div>
    </nav>
    <div class="hero">
      <div class="overlay">
        <div id="top"><p>NEW AUTUMN COLLECTION</p></div>
        <div id="mid"><h2>Objects for a Slower, Quieter Home</h2></div>
        <div id="desc">
          <p>
            Hand-thrown stoneware, made in small batches by potters who still
            get clay under their fingernails
          </p>
        </div>
        <button id="shop-btn">SHOP THE COLLECTION</button>
      </div>
    </div>
    <div class="restocked">
        <div id="featured"><p>FEATURED PIECES</p></div>
        <div id="fresh"><h2>Fresh From the Klin</h2></div>
        <div id="new">
          <p>
            Three New Pieces, Restocked This Week
          </p>
    </div>
    <section class="products">
            <div class="card"></div>
    </section>
  </body>
</html>
